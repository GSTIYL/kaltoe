<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="선택적 근로시간제(월 단위)에서 채운 시간을 기록하면 언제부터 18시 칼퇴가 가능한지 계산합니다.">
<meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="칼퇴">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>칼퇴 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 스크롤 없는 한 화면 앱. 제목 → 기록 한 줄 → 달력(남은 높이를 모두 사용) */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#F4F6F9; --ink:#17202B; --muted:#5A6573; --line:#D5DBE3;
  --accent:#2E3DB8; --accent-soft:#E2E5F9;
  /* 야근 = 파랑, 칼퇴 = 노랑 */
  --ot:#1F55D6; --ot-fill:#3B6FE8; --ot-soft:#DCE6FC; --ok:#7F5400; --ok-fill:#E2AE14; --ok-soft:#FBEDBF;
  --good:#16733F; --today:#17202B;
  --warn:#B42318; --warn-soft:#FBE3E1; --done:#56657A;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141A; --surface:#181E26; --sunk:#131820; --ink:#E4E8EE; --muted:#97A1AE; --line:#2A3240;
    --accent:#9AA5FF; --accent-soft:#242A4C;
    --ot:#86ADFF; --ot-fill:#4D7FEE; --ot-soft:#1A2948; --ok:#F2CB55; --ok-fill:#D5A520; --ok-soft:#382E12;
    --good:#5ACF8B; --today:#FFFFFF;
    --warn:#FF8B80; --warn-soft:#3C1D1B; --done:#8494A9; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141A; --surface:#181E26; --sunk:#131820; --ink:#E4E8EE; --muted:#97A1AE; --line:#2A3240;
  --accent:#9AA5FF; --accent-soft:#242A4C;
  --ot:#86ADFF; --ot-fill:#4D7FEE; --ot-soft:#1A2948; --ok:#F2CB55; --ok-fill:#D5A520; --ok-soft:#382E12;
  --good:#5ACF8B; --today:#FFFFFF;
  --warn:#FF8B80; --warn-soft:#3C1D1B; --done:#8494A9; color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.wrap{max-width:540px;height:100%;min-height:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2{margin:0}
.top h1{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:0 9px;height:36px;min-width:0;width:100%}
input[type="date"],input[type="time"],input.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.iconbtn{width:32px;height:32px;border:1px solid var(--line);background:var(--sunk);border-radius:7px;font-size:17px;line-height:1;flex:0 0 auto}
.ghost{border:1px solid var(--line);background:transparent;border-radius:7px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.primary{border:0;background:var(--accent);color:var(--surface);border-radius:7px;height:36px;padding:0 16px;font-weight:600}
.delta-up{color:var(--good)}
.delta-down{color:var(--warn)}

/* 기록 */
.logbox{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.logform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
@media (min-width:480px){.logform{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 86px auto}}
.msg{margin:0;font-size:12px;color:var(--muted)}
.msg.err{color:var(--warn)}
.latest{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--muted);min-height:22px}
.latest b{color:var(--ink);font-weight:600}
.latest b.delta-up{color:var(--good)}
.latest b.delta-down{color:var(--warn)}
.xbtn{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:3px 6px;border-radius:5px;flex:0 0 auto}
.xbtn:hover{color:var(--warn);background:var(--warn-soft)}

/* 달력: 남은 높이를 모두 쓰고, 칸이 높이를 나눠 가짐 */
.cal-block{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 12px}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav h2{font-size:16px;font-weight:600;min-width:7.2em;text-align:center}
.cal-nav .ghost{margin-left:auto}
.cal-meter{display:flex;flex-direction:column;gap:5px}
.meter-legend{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.meter-legend b{color:var(--ink);font-weight:600}
.meter-track{position:relative;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter-track i{position:absolute;top:0;bottom:0;left:0}
.meter-track .m-acc{background:var(--done)}
.meter-track .m-plan{background:var(--accent);opacity:.45}
.meter-track .m-tgt{width:2px;background:var(--ink)}
.note{margin:0;font-size:12px;color:var(--warn)}
.cal-ctl{display:grid;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:0 0 auto}
.ctl-row{display:grid;grid-template-columns:2.6em 148px minmax(0,1fr);align-items:center;gap:10px;height:42px;padding:0 10px;background:var(--sunk);font-size:13.5px}
.ctl-row+.ctl-row{border-top:1px solid var(--line)}
.ctl-row>.k{color:var(--muted);font-weight:500}
.ctl-row input[type="time"]{height:32px;background:var(--surface);padding:0 6px}
.stepper{display:flex;align-items:center;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);overflow:hidden}
.stepper .iconbtn{width:34px;height:100%;border:0;border-radius:0;background:transparent}
.stepper b{flex:1;text-align:center;font-size:14px;color:var(--ot)}
.ctl-row .lv{justify-self:end;white-space:nowrap}
.ctl-row .lv.free{color:var(--ok)}
.cal{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:auto;grid-auto-rows:minmax(38px,1fr);gap:4px}
.cal-h{font-size:11px;color:var(--muted);text-align:center}
.cell{border-radius:6px;padding:4px 6px;display:flex;flex-direction:column;justify-content:space-between;background:var(--sunk);color:var(--muted);font-size:11px;line-height:1.2;min-width:0;min-height:0;overflow:hidden}
.cell .row1{display:flex;justify-content:space-between;align-items:baseline;gap:2px}
.cell b{font-size:13px;color:var(--ink)}
.cell .t{font-size:10.5px}
.cell .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.cell.blank{background:none}
.cell.past{opacity:.5}
.cell.past b{color:var(--muted);font-weight:500}
.cell.off{background:none;border:1px solid var(--line)}
.cell.ot{background:var(--ot-soft);color:var(--ot)}
.cell.ot b{color:var(--ot)}
.cell.free{background:var(--ok-soft);color:var(--ok)}
.cell.free b{color:var(--ok)}
.cell.hol{background:transparent;border:1px dashed var(--line);color:var(--warn)}
.cell.today{box-shadow:inset 0 0 0 2px var(--today)}
@media (min-width:480px){.cell{padding:6px 8px;font-size:12px}.cell b{font-size:14px}.cell .t{font-size:11.5px}}
.cal-warn{margin:0;font-size:12px;color:var(--warn)}
.cal-stale{margin:0;font-size:12px;color:var(--ot)}
@media (prefers-reduced-motion:no-preference){.meter-track i{transition:width .2s ease,left .2s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>칼퇴 계산기</h1></header>

  <section class="panel logbox" aria-label="채운 시간 기록">
    <form class="logform" id="logform" novalidate>
      <input id="log-date" type="date" aria-label="기준 날짜" required>
      <input id="log-val" class="num" type="text" autocomplete="off" placeholder="채운 시간 183:28" aria-label="채운 시간 (Flex 전체 값)" required>
      <select id="log-when" aria-label="기준 시점"><option value="before">출근 전</option><option value="after">퇴근 후</option></select>
      <button class="primary" type="submit">기록</button>
    </form>
    <p class="msg" id="log-msg" hidden></p>
    <div class="latest" id="logs"></div>
  </section>

  <section class="panel cal-block" id="calendar" aria-label="이 달 야근·칼퇴 달력">
    <div class="cal-nav">
      <button class="iconbtn" type="button" data-mon="-1" aria-label="이전 달">‹</button>
      <h2 id="cal-title" aria-live="polite"></h2>
      <button class="iconbtn" type="button" data-mon="1" aria-label="다음 달">›</button>
      <button class="ghost" type="button" data-mon="0">이번 달</button>
    </div>
    <div class="cal-meter" id="cal-meter"></div>
    <div class="cal-ctl">
      <div class="ctl-row">
        <label class="k" for="cal-start">출근</label>
        <input id="cal-start" type="time" min="09:00" max="10:00" step="60">
        <span class="lv num free" id="free-lv"></span>
      </div>
      <div class="ctl-row">
        <span class="k">야근</span>
        <div class="stepper">
          <button class="iconbtn" type="button" data-ot-step="-0.5" aria-label="야근 기준 30분 줄이기">−</button>
          <b class="num" id="ot-val"></b>
          <button class="iconbtn" type="button" data-ot-step="0.5" aria-label="야근 기준 30분 늘리기">+</button>
        </div>
        <span class="lv num" id="ot-lv"></span>
      </div>
    </div>
    <p class="cal-warn" id="cal-warn" hidden></p>
    <div class="cal" id="cal-grid" role="grid"></div>
    <p class="cal-stale" id="cal-stale" hidden></p>
  </section>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const toMin=t=>{if(!t||!/^\d{1,2}:\d{2}/.test(t))return null;const [h,m]=t.split(':').map(Number);return h*60+m};
const clock=m=>{m=Math.round(m);const x=((m%1440)+1440)%1440;return pad(Math.floor(x/60))+':'+pad(x%60)};
const leaveText=m=>clock(m)+(m>=1440?' (다음날)':'');
const hm=m=>{m=Math.max(0,Math.round(m));return Math.floor(m/60)+':'+pad(m%60)};
const shm=m=>(m<0?'-':'+')+hm(Math.abs(m));
const dur=m=>{const neg=m<0;m=Math.abs(Math.round(m));const h=Math.floor(m/60),mm=m%60;return (neg?'-':'')+(h&&mm?`${h}시간 ${mm}분`:h?`${h}시간`:`${mm}분`)};
const WD=['일','월','화','수','목','금','토'];
const md=k=>{const d=parse(k);return `${d.getMonth()+1}/${d.getDate()}`};
const wd=k=>WD[parse(k).getDay()];
const dl=k=>`${md(k)} (${wd(k)})`;
const now=new Date();
const TODAY=ymd(now);
const KEY='kaltoe-flex-v1';
const CORE_END=18*60, NOON=12*60, LUNCH=60;

// 평일에 걸린 공휴일·대체공휴일
// 2026: 회사 월별 근무시간 표의 평일 수와 일치 / 2027·2028: 한국천문연구원 월력 자료 기준
const HOL={
  '2026-01-01':'신정','2026-02-16':'설날','2026-02-17':'설날','2026-02-18':'설날','2026-03-02':'삼일절 대체','2026-05-01':'노동절','2026-05-05':'어린이날','2026-05-25':'부처님오신날 대체','2026-06-03':'지방선거','2026-08-17':'광복절 대체','2026-09-24':'추석','2026-09-25':'추석','2026-10-05':'개천절 대체','2026-10-09':'한글날','2026-12-25':'성탄절',
  '2027-01-01':'신정','2027-02-08':'설날','2027-02-09':'설날 대체','2027-03-01':'삼일절','2027-05-03':'노동절 대체','2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-07-19':'제헌절 대체','2027-08-16':'광복절 대체','2027-09-14':'추석','2027-09-15':'추석','2027-09-16':'추석','2027-10-04':'개천절 대체','2027-10-11':'한글날 대체','2027-12-27':'성탄절 대체',
  '2028-01-26':'설날','2028-01-27':'설날','2028-01-28':'설날','2028-03-01':'삼일절','2028-04-12':'국회의원선거','2028-05-01':'노동절','2028-05-02':'부처님오신날','2028-05-05':'어린이날','2028-06-06':'현충일','2028-07-17':'제헌절','2028-08-15':'광복절','2028-10-02':'추석','2028-10-03':'추석·개천절','2028-10-04':'추석','2028-10-05':'개천절 대체','2028-10-09':'한글날','2028-12-25':'성탄절'
};
const HOL_YEARS=new Set(Object.keys(HOL).map(k=>k.slice(0,4)));

function defaultState(){
  return {month:TODAY.slice(0,7),start:'10:00',otHours:9,logs:{}};
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);if(!raw)return null;
    const s=Object.assign(defaultState(),JSON.parse(raw));
    s.month=TODAY.slice(0,7);if(!s.logs)s.logs={};
    // 첫 버전의 '지금까지 채운 시간'을 기록 1건으로 옮김
    if(s.acc){for(const mo in s.acc){const a=s.acc[mo],v=(parseInt(a.h)||0)*60+(parseInt(a.m)||0);
      const f=(s.from&&s.from[mo])||TODAY;if(v&&!(s.logs[mo]||[]).length&&f.slice(0,7)===mo)s.logs[mo]=[{d:f,v,when:'before'}]}}
    // 없앤 입력(날짜별 설정, 목표 직접 입력)은 버림
    delete s.acc;delete s.from;delete s.seeded;delete s.days;delete s.tgt;delete s.cap;
    return s;
  }catch(e){return null}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load()||defaultState();

const monthDates=(mo=S.month)=>{const [y,m]=mo.split('-').map(Number);const out=[];for(let d=new Date(y,m-1,1);d.getMonth()===m-1;d=addDays(d,1))out.push(ymd(d));return out};
const isWeekday=k=>{const g=parse(k).getDay();return g!==0&&g!==6};
const startMin=()=>toMin(S.start)??600;
const baseDay=()=>Math.max(0,CORE_END-startMin()-LUNCH);   // 18:00 퇴근 시 하루 근무
// 퇴근 시각 = 출근 + 근무 + 점심(정오를 넘기면) + 8시간 초과 연장 4시간마다 휴게 30분
function leaveOf(work){
  const s=startMin();let t=s+work;
  if(s<NOON&&t>NOON)t+=LUNCH;
  return t+Math.floor(Math.max(0,work-480)/240)*30;
}
const workdays=()=>monthDates().filter(k=>isWeekday(k)&&!HOL[k]);
// 회사 기준: 목표 = min(평일 수 × 8h, 월 일수 ÷ 7 × 40h), 연장 가능 = 월 일수 ÷ 7 × 12h
const days=()=>monthDates().length;
const targetMin=()=>Math.min(workdays().length*480,Math.round(days()/7*40*60));
const capMin=()=>Math.round(days()/7*12*60);

/* ---------- 채운 시간 기록 ---------- */
const logsOf=()=>(S.logs[S.month]||[]).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.when==='after')-(b.when==='after'));
const latestLog=()=>{const l=logsOf();return l.length?l[l.length-1]:null};
const fromOf=log=>log?(log.when==='after'?ymd(addDays(parse(log.d),1)):log.d):monthDates()[0];
function paceOf(log,T){
  const W=workdays();if(!W.length)return 0;
  const done=W.filter(k=>log.when==='after'?k<=log.d:k<log.d).length;
  return Math.round(T*done/W.length);
}
function parseDur(s){
  s=String(s||'').trim().replace(/\s+/g,'');if(!s)return null;
  let m;
  if((m=s.match(/^(\d+):(\d{1,2})$/)))return +m[1]*60+ +m[2];
  if((m=s.match(/^(\d+)(?:시간|h|H)(?:(\d{1,2})(?:분|m|M)?)?$/)))return +m[1]*60+(+m[2]||0);
  if((m=s.match(/^(\d{1,2})(?:분|m|M)$/)))return +m[1];
  if((m=s.match(/^\d+(?:\.\d+)?$/)))return Math.round(parseFloat(s)*60);
  return null;
}

// 남은 근무일에 야근을 앞쪽부터 채우고, 나머지 날은 18:00 퇴근
function compute(acc,from){
  const P=Math.round((parseFloat(S.otHours)||0)*60),base=baseDay();
  const rows=monthDates().filter(k=>k>=from&&isWeekday(k)).map(k=>({k,hol:!!HOL[k],base:HOL[k]?0:base,extra:0}));
  const work=rows.filter(x=>!x.hol);
  const T=targetMin(),cap=capMin();
  const R=T-acc,E=R-work.length*base;
  const c={rows,work,m:work.length,acc,T,cap,P,R,E,k:0,kind:''};
  if(c.m===0)c.kind=R<=0?'achieved':'short';
  else if(E<=0)c.kind=R<=0?'achieved':'free';
  else{
    let rem=E;
    for(let i=0;i<work.length&&rem>0;i++){const add=Math.min(rem,Math.max(0,P-base));work[i].extra=add;rem-=add;if(add>0)c.k=i+1}
    if(rem>0){
      c.kind='over';c.avg=Math.ceil(R/c.m);
      const each=Math.floor(E/c.m),r0=E-each*c.m;
      work.forEach((x,i)=>{x.extra=each+(i<r0?1:0)});c.k=c.m;
    }else c.kind='plan';
  }
  rows.forEach(x=>{x.min=x.base+x.extra;x.leave=x.hol?null:leaveOf(x.min)});
  c.first=c.kind==='plan'&&c.k<c.m?work[c.k]:(c.kind==='free'||c.kind==='achieved')&&c.m?work[0]:null;
  c.projected=acc+rows.reduce((a,x)=>a+x.min,0);
  return c;
}
const freeText=c=>c.kind==='over'||c.kind==='short'?'부족':c.first?md(c.first.k):c.kind==='achieved'?'달성':'없음';

function renderLatest(c,log){
  const box=$('#logs');
  if(!log){box.innerHTML='<span>기록 없음 · 이 달 1일부터 0시간으로 계산</span>';return}
  const diff=log.v-paceOf(log,c.T),i=(S.logs[S.month]||[]).indexOf(log);
  box.innerHTML=`<span><b class="num">${md(log.d)}</b> ${log.when==='after'?'퇴근 후':'출근 전'} <b class="num">${hm(log.v)}</b> · 페이스 <b class="num ${diff>=0?'delta-up':'delta-down'}">${shm(diff)}</b> · 칼퇴 <b class="num">${freeText(c)}</b></span>
    <button class="xbtn" type="button" data-del="${i}" aria-label="${md(log.d)} 기록 삭제">×</button>`;
}
let msgTimer=null;
function say(text,err){
  const m=$('#log-msg');m.textContent=text;m.className='msg'+(err?' err':'');m.hidden=false;
  clearTimeout(msgTimer);msgTimer=setTimeout(()=>{m.hidden=true},err?5000:2500);
}
// 기준 날짜는 항상 오늘로 시작하고, 지난 날짜는 고를 수 없음
function resetLogForm(){
  $('#log-date').min=TODAY;$('#log-date').value=TODAY;
  $('#log-when').value=now.getHours()>=18?'after':'before';
}
$('#logform').addEventListener('submit',e=>{
  e.preventDefault();
  const d=$('#log-date').value,v=parseDur($('#log-val').value),when=$('#log-when').value;
  if(!d)return say('기준 날짜를 고르세요.',true);
  if(d<TODAY){$('#log-date').value=TODAY;return say('지난 날짜로는 기록할 수 없습니다.',true)}
  if(v==null){$('#log-val').focus();return say('채운 시간을 183:28 또는 183시간 28분 형식으로 입력하세요.',true)}
  const mo=d.slice(0,7),list=S.logs[mo]||(S.logs[mo]=[]);
  const same=list.findIndex(l=>l.d===d&&l.when===when);
  if(same>=0)list[same].v=v;else list.push({d,v,when});
  S.month=mo;
  say(`${md(d)} ${when==='after'?'퇴근 후':'출근 전'} ${dur(v)} ${same>=0?'수정':'기록'}했습니다.`);
  $('#log-val').value='';$('#log-date').value=TODAY;
  update();
});
$('#logs').addEventListener('click',e=>{
  const b=e.target.closest('[data-del]');if(!b)return;
  (S.logs[S.month]||[]).splice(+b.dataset.del,1);update();
});

/* ---------- 달력 ---------- */
function renderCalendar(c){
  const byK={};c.rows.forEach(x=>byK[x.k]=x);
  const from=c.rows.length?c.rows[0].k:'9999';
  const ks=monthDates().filter(isWeekday);
  let cells=['월','화','수','목','금'].map(w=>`<div class="cal-h" aria-hidden="true">${w}</div>`).join('');
  const lead=ks.length?parse(ks[0]).getDay()-1:0;
  for(let i=0;i<lead;i++)cells+='<div class="cell blank" aria-hidden="true"></div>';
  ks.forEach(k=>{
    const x=byK[k];let cls,lab='',t='';
    if(k<TODAY){cls='past';lab=HOL[k]||''}
    else if(!x)cls='off';
    else if(x.hol){cls='hol';lab=HOL[k]}
    else if(x.extra>0){cls='ot';lab='야근 필요';t=clock(x.leave)}
    else{cls='free';lab='칼퇴 가능';t=clock(x.leave)}
    cells+=`<div class="cell ${cls}${k===TODAY?' today':''}"${k===TODAY?' aria-current="date"':''} title="${dl(k)} ${lab}${t?' '+t+' 퇴근':''}">
      <span class="row1"><b class="num">${parse(k).getDate()}</b>${t?`<span class="num t">${t}</span>`:''}</span><span class="lab">${lab}</span></div>`;
  });
  $('#cal-grid').innerHTML=cells;

  const [y,m]=S.month.split('-').map(Number);
  $('#cal-title').textContent=`${y}년 ${m}월`;
  const max=c.T+c.cap,scale=Math.max(max,c.projected)||1;
  $('#cal-meter').innerHTML=`<div class="meter-legend"><span>월말 예상 <b class="num">${hm(c.projected)}</b></span><span class="num">목표 ${hm(c.T)} · 상한 ${hm(max)}</span></div>
    <div class="meter-track" aria-hidden="true">
      <i class="m-plan" style="width:${Math.min(100,c.projected/scale*100)}%"></i>
      <i class="m-acc" style="width:${Math.min(100,c.acc/scale*100)}%"></i>
      <i class="m-tgt" style="left:${Math.min(99.5,c.T/scale*100)}%"></i>
    </div>`
    +(c.projected>max?`<p class="note">월말 예상이 상한을 ${dur(c.projected-max)} 넘습니다.</p>`:'')
    +(HOL_YEARS.has(String(y))?'':`<p class="note">${y}년 공휴일 정보가 없어 평일을 모두 근무일로 계산했습니다.</p>`);

  const si=$('#cal-start');if(document.activeElement!==si)si.value=S.start;
  $('#free-lv').textContent=`→ ${clock(leaveOf(baseDay()))} 칼퇴`;
  $('#ot-val').textContent=`${c.P/60}시간`;
  $('#ot-lv').textContent=`→ ${leaveText(leaveOf(c.P))} 퇴근`;

  const warn=c.kind==='over'?`야근 ${c.P/60}시간으로는 부족합니다. 남은 날 하루 평균 ${dur(c.avg)}씩 필요합니다.`
    :c.kind==='short'?`남은 근무일이 없습니다. 목표까지 ${dur(c.R)} 부족합니다.`:'';
  $('#cal-warn').textContent=warn;$('#cal-warn').hidden=!warn;
  const stale=c.rows.length&&from<TODAY,sl=$('#cal-stale');sl.hidden=!stale;
  if(stale)sl.textContent=`마지막 기록 이후 지난 날도 계획에 들어가 있어요. 오늘 값을 기록하면 정확해집니다.`;
}

function update(){
  const log=latestLog(),c=compute(log?log.v:0,fromOf(log));
  renderCalendar(c);renderLatest(c,log);save();
}
function shiftMonth(d){const [y,m]=S.month.split('-').map(Number);const x=new Date(y,m-1+d,1);S.month=`${x.getFullYear()}-${pad(x.getMonth()+1)}`;update()}
$('#cal-start').addEventListener('input',e=>{if(!e.target.value)return;S.start=e.target.value;update()});
$('#calendar').addEventListener('click',e=>{
  const mb=e.target.closest('[data-mon]');if(mb){if(+mb.dataset.mon)shiftMonth(+mb.dataset.mon);else{S.month=TODAY.slice(0,7);update()}return}
  const st=e.target.closest('[data-ot-step]');
  if(st){S.otHours=Math.min(16,Math.max(7.5,Math.round(((parseFloat(S.otHours)||9)+parseFloat(st.dataset.otStep))*2)/2));update()}
});

resetLogForm();
update();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
